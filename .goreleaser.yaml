version: 2

project_name: dotnet-ipam-terraform

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: provider
    binary: terraform-provider-dotnet-ipam-terraform
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
