name: ci

on:
  push:
  pull_request:

jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Prepare modules
        run: |
          make tidy
      - name: Unit tests
        run: |
          make test
      - name: Build provider binary
        run: |
          make dev-install
      - name: Terraform validate examples
        uses: hashicorp/setup-terraform@v3
      - run: |
          cat > "$RUNNER_TEMP/terraformrc" <<RC
          provider_installation {
            dev_overrides {
              "leomylonas/dotnet-ipam" = "${PWD}/.terraform-dev"
            }
            direct {}
          }
          RC
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/terraformrc"
          for ex in examples/basic examples/multi-role; do
            cd "$ex"
            terraform init -backend=false
            terraform validate
            cd - >/dev/null
          done
